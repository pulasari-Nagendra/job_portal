<header class="navbar">

    <div class="logo">
        <a href="/" style="text-decoration:none;color:inherit;">
            <span>Job</span>Sphere
        </a>
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/jobs-page">Jobs</a>
        <a href="#categories">Categories</a>
        <a href="#how-it-works">How it works</a>
    </nav>

    <div class="nav-actions" id="navActions">
        <!-- JavaScript fills this -->
    </div>

</header>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const navActions =
        document.getElementById("navActions");

    const token =
        localStorage.getItem("access_token");

    const storedUser =
        localStorage.getItem("user");

    if (!token || !storedUser) {

        navActions.innerHTML = `
            <a href="/login-page" class="login-btn">
                Login
            </a>

            <a href="/signup-page" class="signup-btn">
                Get Started
            </a>
        `;

        return;
    }

    try {

        const user = JSON.parse(storedUser);

        if (user.role === "candidate") {

            navActions.innerHTML = `
                <a href="/candidate-dashboard"
                   class="login-btn">
                    Dashboard
                </a>

                <a href="/my-applications-page"
                   class="login-btn">
                    Applications
                </a>

                <button
                    class="signup-btn"
                    onclick="logoutUser()">
                    Logout
                </button>
            `;

        } else if (user.role === "employer") {

            navActions.innerHTML = `
                <a href="/employer-dashboard"
                   class="login-btn">
                    Dashboard
                </a>

                <a href="/create-job"
                   class="login-btn">
                    Post Job
                </a>

                <button
                    class="signup-btn"
                    onclick="logoutUser()">
                    Logout
                </button>
            `;

        } else {

            localStorage.removeItem("access_token");
            localStorage.removeItem("user");

            window.location.reload();
        }

    } catch (error) {

        localStorage.removeItem("access_token");
        localStorage.removeItem("user");

        window.location.reload();
    }
});


function logoutUser() {

    localStorage.removeItem("access_token");
    localStorage.removeItem("user");

    window.location.href = "/";
}
</script>
