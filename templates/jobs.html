<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere | Jobs</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .jobs-page {
            padding: 50px 7%;
        }

        .jobs-header {
            margin-bottom: 30px;
        }

        .jobs-header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .jobs-header p {
            color: #737b8d;
        }

        .job-filters {
            background: white;
            padding: 18px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(40, 45, 80, 0.08);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .job-filters input,
        .job-filters select {
            padding: 13px 15px;
            border: 1px solid #e1e4ec;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .job-filters input {
            flex: 1;
            min-width: 220px;
        }

        .job-filters select {
            min-width: 160px;
        }

        .filter-btn {
            border: none;
            background: linear-gradient(135deg, #6657f5, #8c5df7);
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .job-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #eceef5;
            transition: 0.25s ease;
        }

        .job-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 35px rgba(40, 45, 80, 0.12);
        }

        .company-icon {
            width: 55px;
            height: 55px;
            background: #eeeaff;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 18px;
        }

        .job-card h3 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .company {
            color: #6657f5;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .job-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .job-tag {
            background: #f2f3f8;
            padding: 7px 10px;
            border-radius: 8px;
            color: #626a7d;
            font-size: 13px;
        }

        .job-description {
            color: #737b8d;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .job-actions {
            display: flex;
            gap: 10px;
        }

        .details-btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 11px;
            border-radius: 9px;
            background: #172033;
            color: white;
            font-weight: bold;
        }

        .apply-btn {
            flex: 1;
            text-align: center;
            text-decoration: none;
            padding: 11px;
            border-radius: 9px;
            background: #eeeaff;
            color: #6657f5;
            font-weight: bold;
        }

        .no-jobs {
            text-align: center;
            padding: 70px 20px;
            color: #737b8d;
        }

        @media (max-width: 1000px) {
            .jobs-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 650px) {
            .jobs-grid {
                grid-template-columns: 1fr;
            }

            .jobs-page {
                padding: 35px 5%;
            }
        }
        .clear-btn {
    border: none;
    background: #f1f2f6;
    color: #4d5566;
    padding: 13px 18px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
}

.clear-btn:hover {
    background: #e7e8ee;
}
    </style>
</head>

<body>



{% include 'navbar.html' %}

<main class="jobs-page">

    <div class="jobs-header">
        <span class="section-tag">OPPORTUNITIES</span>

        <h1>Find your next job 🚀</h1>

        <p>
            Explore opportunities from companies hiring talented people.
        </p>
    </div>


    <div class="job-filters">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search job title or company">

        <input
            type="text"
            id="locationInput"
            placeholder="📍 Location">

        <select id="jobType">
            <option value="">All Job Types</option>
            <option value="Full-time">Full-time</option>
            <option value="Part-time">Part-time</option>
            <option value="Internship">Internship</option>
        </select>

        <button
            type="button"
            id="searchButton"
            class="filter-btn">
            Search
        </button>
        <button
            type="button"
            class="clear-btn"
            onclick="clearFilters()">
            Clear
        </button>
    </div>
    <div
        id="jobCount"
        style="
            margin-bottom: 20px;
            color: #6f7789;
            font-weight: 700;
        ">
        Loading jobs...
    </div>

    <div id="jobsGrid" class="jobs-grid"></div>

</main>


<script src="{{ url_for('static', filename='js/jobs.js') }}"></script>

</body>
</html>
