<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere | My Applications</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .applications-page {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 25px 70px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 38px;
            margin: 8px 0;
        }

        .page-header p {
            color: #737b8d;
        }

        .application-card {
            background: white;
            border: 1px solid #eceef5;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 16px;
            box-shadow: 0 8px 25px rgba(40, 45, 80, 0.05);
        }

        .application-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }

        .application-info {
            display: flex;
            gap: 15px;
        }

        .application-icon {
            width: 58px;
            height: 58px;
            border-radius: 15px;
            background: #eeeaff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            flex-shrink: 0;
        }

        .application-info h2 {
            margin: 0 0 7px;
            font-size: 21px;
        }

        .company {
            color: #6657f5;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .meta {
            color: #737b8d;
            font-size: 14px;
        }

        .status {
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }

        .status-applied {
            background: #eeeaff;
            color: #6657f5;
        }

        .status-shortlisted {
            background: #e3f8ec;
            color: #176b3a;
        }

        .status-rejected {
            background: #ffe7e7;
            color: #a32222;
        }

        .application-bottom {
            margin-top: 20px;
            padding-top: 17px;
            border-top: 1px solid #eceef5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .applied-date {
            color: #7b8393;
            font-size: 13px;
        }

        .view-job {
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 9px;
            background: #f0eeff;
            color: #6657f5;
            font-weight: 700;
        }

        .loading,
        .empty-state {
            text-align: center;
            background: white;
            border-radius: 20px;
            padding: 55px 25px;
            color: #737b8d;
        }

        .browse-btn {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            background: linear-gradient(135deg, #6657f5, #8c5df7);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 800;
        }

        @media (max-width: 650px) {
            .application-top {
                flex-direction: column;
            }

            .application-bottom {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

{% include 'navbar.html' %}

<main class="applications-page">

    <div class="page-header">
        <span class="section-tag">CANDIDATE</span>

        <h1>My Applications 📋</h1>

        <p>
            Track the jobs you've applied for and monitor their status.
        </p>
    </div>

    <div id="applicationsList">

        <div class="loading">
            Loading your applications...
        </div>

    </div>

</main>


<script>

const token = localStorage.getItem("access_token");
const storedUser = localStorage.getItem("user");

if (!token) {
    window.location.href = "/login-page";
}

if (storedUser) {

    const user = JSON.parse(storedUser);

    if (user.role !== "candidate") {
        window.location.href = "/";
    }
}


async function loadApplications() {

    const container =
        document.getElementById("applicationsList");

    try {

        const response = await fetch(
            "/my-applications",
            {
                method: "GET",
                headers: {
                    "Authorization": "Bearer " + token
                }
            }
        );

        const applications = await response.json();

        if (!response.ok) {

            container.innerHTML = `
                <div class="empty-state">
                    <h2>Unable to load applications</h2>
                    <p>
                        ${escapeHtml(
                            applications.message ||
                            "Please try again."
                        )}
                    </p>
                </div>
            `;

            return;
        }


        if (applications.length === 0) {

            container.innerHTML = `
                <div class="empty-state">

                    <h2>No applications yet 🚀</h2>

                    <p>
                        Explore available jobs and submit
                        your first application.
                    </p>

                    <a href="/jobs-page"
                       class="browse-btn">
                        Browse Jobs →
                    </a>

                </div>
            `;

            return;
        }


        container.innerHTML = applications
            .map(application => {

                let statusClass = "status-applied";

                if (application.status === "Shortlisted") {
                    statusClass = "status-shortlisted";
                }

                if (application.status === "Rejected") {
                    statusClass = "status-rejected";
                }

                const formattedDate =
                    new Date(
                        application.applied_at
                    ).toLocaleDateString(
                        "en-IN",
                        {
                            day: "2-digit",
                            month: "short",
                            year: "numeric"
                        }
                    );


                return `
                    <div class="application-card">

                        <div class="application-top">

                            <div class="application-info">

                                <div class="application-icon">
                                    💼
                                </div>

                                <div>

                                    <h2>
                                        ${escapeHtml(
                                            application.title
                                        )}
                                    </h2>

                                    <div class="company">
                                        ${escapeHtml(
                                            application.company
                                        )}
                                    </div>

                                    <div class="meta">
                                        📍 ${escapeHtml(
                                            application.location
                                        )}
                                        &nbsp; • &nbsp;
                                        💼 ${escapeHtml(
                                            application.job_type
                                        )}
                                    </div>

                                </div>

                            </div>


                            <span
                                class="status ${statusClass}">
                                ${escapeHtml(
                                    application.status
                                )}
                            </span>

                        </div>


                        <div class="application-bottom">

                            <span class="applied-date">
                                Applied on ${formattedDate}
                            </span>

                            <a
                                href="/job-details-page?id=${application.job_id}"
                                class="view-job">
                                View Job →
                            </a>

                        </div>

                    </div>
                `;

            })
            .join("");


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty-state">
                <h2>Something went wrong</h2>
                <p>Unable to connect to the server.</p>
            </div>
        `;
    }
}


function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadApplications();

</script>

</body>
</html>
