<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere | Sign Up</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .signup-page {
            min-height: calc(100vh - 76px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;

            background:
                radial-gradient(circle at 10% 20%, #e9e4ff 0, transparent 30%),
                radial-gradient(circle at 90% 75%, #dff7ff 0, transparent 30%),
                #f8f9ff;
        }

        .signup-card {
            width: 100%;
            max-width: 620px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 55px rgba(40, 45, 80, 0.12);
        }

        .signup-card h1 {
            font-size: 34px;
            margin: 10px 0;
        }

        .signup-subtitle {
            color: #737b8d;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* ROLE SELECTION */

        .role-title {
            font-weight: 800;
            margin-bottom: 12px;
        }

        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .role-option {
            position: relative;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .role-label {
            display: block;
            padding: 20px;
            border: 2px solid #e3e5ed;
            border-radius: 17px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .role-label:hover {
            transform: translateY(-2px);
            border-color: #cfc8ff;
        }

        .role-option input:checked + .role-label {
            border-color: #6657f5;
            background: #f2efff;
            box-shadow: 0 8px 20px rgba(102, 87, 245, 0.10);
        }

        .role-icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .role-label strong {
            display: block;
            font-size: 17px;
            margin-bottom: 6px;
        }

        .role-label span {
            color: #737b8d;
            font-size: 13px;
            line-height: 1.5;
            display: block;
        }

        /* FORM */

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dfe2eb;
            border-radius: 11px;
            outline: none;
            font-size: 15px;
        }

        .form-group input:focus {
            border-color: #6657f5;
            box-shadow: 0 0 0 3px rgba(102, 87, 245, 0.10);
        }

        .signup-submit {
            width: 100%;
            border: none;
            padding: 15px;
            margin-top: 8px;
            border-radius: 11px;
            background: linear-gradient(135deg, #6657f5, #8c5df7);
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .signup-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .signup-message {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
        }

        .signup-success {
            background: #e3f8ec;
            color: #176b3a;
        }

        .signup-error {
            background: #ffe7e7;
            color: #a52121;
        }

        .signup-footer {
            text-align: center;
            margin-top: 24px;
            color: #737b8d;
        }

        .signup-footer a {
            color: #6657f5;
            font-weight: 700;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .signup-card {
                padding: 25px;
            }

            .role-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>Job</span>Sphere
    </div>

    <nav>
        <a href="/">Home</a>
        <a href="/jobs-page">Jobs</a>
        <a href="/">Categories</a>
        <a href="/">How it works</a>
    </nav>

    <div class="nav-actions">
        <a href="/login-page" class="login-btn">Login</a>
        <a href="/signup-page" class="signup-btn">Get Started</a>
    </div>

</header>


<main class="signup-page">

    <div class="signup-card">

        <span class="section-tag">JOIN JOBSPHERE</span>

        <h1>Create your account 🚀</h1>

        <p class="signup-subtitle">
            Choose how you want to use JobSphere and create your account.
        </p>


        <!-- ROLE -->

        <div class="role-title">
            I am joining as
        </div>

        <div class="role-options">

            <div class="role-option">

                <input
                    type="radio"
                    name="role"
                    id="candidate"
                    value="candidate"
                    checked>

                <label
                    for="candidate"
                    class="role-label">

                    <div class="role-icon">
                        👨‍🎓
                    </div>

                    <strong>Candidate</strong>

                    <span>
                        For job seekers who want to
                        discover opportunities and apply for jobs.
                    </span>

                </label>

            </div>


            <div class="role-option">

                <input
                    type="radio"
                    name="role"
                    id="employer"
                    value="employer">

                <label
                    for="employer"
                    class="role-label">

                    <div class="role-icon">
                        🏢
                    </div>

                    <strong>Employer</strong>

                    <span>
                        For companies and hiring professionals
                        who want to post jobs and find talent.
                    </span>

                </label>

            </div>

        </div>


        <!-- FORM -->

        <form id="signupForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    placeholder="Enter your full name"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    placeholder="you@example.com"
                    required>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    autocomplete="new-password"
                    placeholder="Create a password"
                    required>

            </div>


            <button
                type="submit"
                class="signup-submit"
                id="signupButton">

                Create Account →

            </button>

        </form>


        <div
            id="signupMessage"
            class="signup-message">
        </div>


        <div class="signup-footer">

            Already have an account?

            <a href="/login-page">
                Login
            </a>

        </div>

    </div>

</main>


<script>

document
    .getElementById("signupForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const role =
            document.querySelector(
                'input[name="role"]:checked'
            ).value;

        const button =
            document.getElementById("signupButton");

        const message =
            document.getElementById("signupMessage");


        button.disabled = true;
        button.textContent = "Creating Account...";

        message.style.display = "none";


        try {

            const response = await fetch("/signup", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password,
                    role: role
                })

            });


            const data = await response.json();


            if (!response.ok) {

                message.className =
                    "signup-message signup-error";

                message.textContent =
                    data.message || "Signup failed";

                message.style.display = "block";

                button.disabled = false;
                button.textContent = "Create Account →";

                return;
            }


            message.className =
                "signup-message signup-success";

            message.textContent =
                "✅ Account created successfully! Redirecting to login...";

            message.style.display = "block";


            setTimeout(function() {

                window.location.href =
                    "/login-page";

            }, 1000);


        } catch (error) {

            console.error(error);

            message.className =
                "signup-message signup-error";

            message.textContent =
                "Unable to connect to the server.";

            message.style.display = "block";

            button.disabled = false;
            button.textContent = "Create Account →";
        }

    });

</script>

</body>
</html>
