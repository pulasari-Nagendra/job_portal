<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere | Edit Job</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .edit-page {
            max-width: 900px;
            margin: 50px auto;
            padding: 0 25px 70px;
        }

        .edit-header {
            margin-bottom: 30px;
        }

        .edit-header h1 {
            font-size: 38px;
            margin: 8px 0;
        }

        .edit-header p {
            color: #737b8d;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 24px;
            border: 1px solid #eceef5;
            box-shadow: 0 15px 40px rgba(40, 45, 80, 0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .required {
            color: #e05252;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfe3ec;
            border-radius: 11px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 130px;
            resize: vertical;
            line-height: 1.6;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6657f5;
            box-shadow: 0 0 0 3px rgba(102, 87, 245, 0.10);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 10px;
        }

        .cancel-btn,
        .save-btn {
            padding: 13px 20px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        .cancel-btn {
            background: #f1f2f6;
            color: #4d5566;
        }

        .save-btn {
            background: linear-gradient(135deg, #6657f5, #8c5df7);
            color: white;
        }

        .save-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .form-message {
            display: none;
            padding: 13px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-message.success {
            background: #e3f8ec;
            color: #176b3a;
        }

        .form-message.error {
            background: #ffe7e7;
            color: #a32121;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .form-card {
                padding: 25px;
            }

            .form-actions {
                flex-direction: column;
            }

            .cancel-btn,
            .save-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

{% include 'navbar.html' %}

<main class="edit-page">

    <div class="edit-header">

        <span class="section-tag">EMPLOYER</span>

        <h1>Edit Job ✏️</h1>

        <p>
            Update your job posting and save the changes.
        </p>

    </div>

    <div id="formMessage" class="form-message"></div>

    <form id="editJobForm" class="form-card">

        <div class="form-grid">

            <div class="form-group">
                <label for="title">
                    Job Title <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="title"
                    required>
            </div>


            <div class="form-group">
                <label for="company">
                    Company <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="company"
                    required>
            </div>


            <div class="form-group">
                <label for="location">
                    Location <span class="required">*</span>
                </label>

                <input
                    type="text"
                    id="location"
                    required>
            </div>


            <div class="form-group">
                <label for="salary">
                    Salary
                </label>

                <input
                    type="text"
                    id="salary"
                    placeholder="Optional">
            </div>


            <div class="form-group">

                <label for="job_type">
                    Job Type <span class="required">*</span>
                </label>

                <select id="job_type" required>

                    <option value="">
                        Select job type
                    </option>

                    <option value="Full-time">
                        Full-time
                    </option>

                    <option value="Part-time">
                        Part-time
                    </option>

                    <option value="Internship">
                        Internship
                    </option>

                </select>

            </div>


            <div class="form-group full-width">

                <label for="description">
                    Job Description <span class="required">*</span>
                </label>

                <textarea
                    id="description"
                    required></textarea>

            </div>


            <div class="form-group full-width">

                <label for="requirements">
                    Requirements <span class="required">*</span>
                </label>

                <textarea
                    id="requirements"
                    required></textarea>

            </div>

        </div>


        <div class="form-actions">

            <a
                href="/employer-dashboard"
                class="cancel-btn">
                Cancel
            </a>

            <button
                type="submit"
                id="saveButton"
                class="save-btn">
                Save Changes
            </button>

        </div>

    </form>

</main>


<script>

const token =
    localStorage.getItem("access_token");

const storedUser =
    localStorage.getItem("user");


/* Authentication */

if (!token) {
    window.location.href = "/login-page";
}


if (storedUser) {

    const user = JSON.parse(storedUser);

    if (user.role !== "employer") {
        window.location.href = "/";
    }
}


/* Get Job ID */

const params =
    new URLSearchParams(window.location.search);

const jobId =
    params.get("id");


if (!jobId) {

    alert("Job ID is missing.");

    window.location.href =
        "/employer-dashboard";
}


/* Message */

function showMessage(text, type) {

    const message =
        document.getElementById("formMessage");

    message.textContent = text;

    message.className =
        `form-message ${type}`;

    message.style.display = "block";
}


/* Load existing job */

async function loadJob() {

    try {

        const response =
            await fetch(`/jobs/${jobId}`);

        const job =
            await response.json();


        if (!response.ok) {

            showMessage(
                job.message || "Unable to load job",
                "error"
            );

            return;
        }


        document.getElementById("title").value =
            job.title || "";

        document.getElementById("company").value =
            job.company || "";

        document.getElementById("location").value =
            job.location || "";

        document.getElementById("salary").value =
            job.salary || "";

        document.getElementById("job_type").value =
            job.job_type || "";

        document.getElementById("description").value =
            job.description || "";

        document.getElementById("requirements").value =
            job.requirements || "";


    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to the server.",
            "error"
        );
    }
}


/* Save changes */

document
    .getElementById("editJobForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const button =
            document.getElementById("saveButton");

        button.disabled = true;
        button.textContent = "Saving...";


        const jobData = {

            title:
                document.getElementById("title")
                    .value.trim(),

            company:
                document.getElementById("company")
                    .value.trim(),

            location:
                document.getElementById("location")
                    .value.trim(),

            salary:
                document.getElementById("salary")
                    .value.trim(),

            description:
                document.getElementById("description")
                    .value.trim(),

            requirements:
                document.getElementById("requirements")
                    .value.trim(),

            job_type:
                document.getElementById("job_type")
                    .value

        };


        try {

            const response =
                await fetch(`/jobs/${jobId}`, {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " + token
                    },

                    body:
                        JSON.stringify(jobData)
                });


            const data =
                await response.json();


            if (!response.ok) {

                showMessage(
                    data.message ||
                    "Failed to update job",
                    "error"
                );

                button.disabled = false;
                button.textContent =
                    "Save Changes";

                return;
            }


            showMessage(
                "✅ Job updated successfully!",
                "success"
            );


            setTimeout(() => {

                window.location.href =
                    "/employer-dashboard";

            }, 1000);


        } catch (error) {

            console.error(error);

            showMessage(
                "Unable to connect to the server.",
                "error"
            );

            button.disabled = false;
            button.textContent =
                "Save Changes";
        }

    });


loadJob();


function logout() {

    localStorage.removeItem("access_token");
    localStorage.removeItem("user");

    window.location.href = "/";
}

</script>

</body>
</html>
